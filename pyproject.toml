[project]
name = "fantasy-war-room"
version = "0.1.0"
description = "A time-aware, probabilistic fantasy football draft copilot"
readme = "README.md"
authors = [
    { name = "notloganmartinson", email = "loganmarty22@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "platformdirs>=4.11.0",
    "polars>=1.43.1",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pytz>=2025.2",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
    "typer>=0.27.0",
]

[project.scripts]
fwr = "fantasy_war_room:main"
fantasy-war-room = "fantasy_war_room:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.1",
]
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"] # Typer declares CLI options through evaluated defaults.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
